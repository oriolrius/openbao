# SPDX-License-Identifier: Apache-2.0
#
# PKI Manager image of this fork (downstream/pki-manager/image).
#
# - Pull requests and pushes to `pki-manager*` branches: build linux/amd64, run the
#   downstream tests and the image smoke test. Nothing is published.
# - Tag `v<upstream>-pki-manager.<n>` (e.g. v2.7.3-pki-manager.1), or a manual run with
#   publish=true: also build linux/amd64 + linux/arm64, push to
#   ghcr.io/<owner>/openbao:<upstream>-pki-manager.<n>, attach SBOM and provenance, and
#   sign the digest with cosign (keyless). The job summary records the digest.
name: PKI Manager image

on:
  push:
    branches: ["pki-manager", "pki-manager-*"]
    tags: ["v*-pki-manager.*"]
  pull_request:
    branches: ["pki-manager"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image (needs a v*-pki-manager.* tag ref)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pki-manager-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKERFILE: downstream/pki-manager/image/Dockerfile
  IMAGE: ghcr.io/${{ github.repository_owner }}/openbao

jobs:
  test:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # The interop test is the optional OpenSSL cross-check: it runs when openssl is
      # on PATH and skips otherwise. No step here needs the openssl CLI.
      - name: Downstream tests (SCEP session-key transport, smoke fixtures)
        run: |
          (cd sdk && go test -count=1 -run PKCS1v15 ./helper/keysutil/)
          go test -count=1 -run PKCS1v15 ./internal/builtin/logical/transit/
          go test -count=1 -v ./downstream/pki-manager/image/smokefixtures/ ./downstream/pki-manager/interop/
      - name: Commit time
        id: v
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: openbao-pki-manager:test
          build-args: |
            OPENBAO_COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
          cache-from: type=gha,scope=pki-manager-image
          cache-to: type=gha,mode=max,scope=pki-manager-image
      - name: Smoke test
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash downstream/pki-manager/image/smoke-test.sh openbao-pki-manager:test

  publish:
    name: Publish
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-pki-manager.') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version from the tag
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-pki-manager\.([0-9]+)$ ]] || { echo "bad tag $tag"; exit 1; }
          echo "upstream=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          build-args: |
            OPENBAO_VERSION=${{ steps.v.outputs.upstream }}
            OPENBAO_COMMIT=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.v.outputs.epoch }}
          cache-from: type=gha,scope=pki-manager-image
      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "- source commit: \`${GITHUB_SHA}\`"
            echo "- digest: \`${DIGEST}\`"
            echo "- pin in PKI Manager openbao/image.env: \`OPENBAO_PUBLISHED_IMAGE=${IMAGE}:${TAG}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
